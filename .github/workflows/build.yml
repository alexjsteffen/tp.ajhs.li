name: Build and Upload Dist

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown

    - name: Install Trunk
      uses: jetli/trunk-action@v0.4.0
      with:
        version: 'latest'

    - name: Build with build.sh
      run: |
        chmod +x build.sh
        ./build.sh

    - name: Package dist.zip
      run: |
        # Replicate logic from build.sh to find the output directory
        path=$(cat src/constant.rs | grep SUBPATH | grep ^pub | sed "s/^.*=//g" | sed "s/\"//g" | sed "s/\///g" | sed "s/;//g")
        target=$( echo $path | sed "s/\///g")
        
        if [ -n "$target" ] && [ -d "$target" ]; then
          echo "Zipping target directory: $target"
          zip -r dist.zip "$target"
        elif [ -d "dist" ]; then
          echo "Zipping standard dist directory"
          zip -r dist.zip dist
        else
          echo "Error: Could not find build output directory"
          exit 1
        fi

    - name: Upload dist.zip artifact
      uses: actions/upload-artifact@v4
      with:
        name: dist-zip
        path: dist.zip
